[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfinding-c-engine"
version = "0.1.0"
description = "Mesin pencari rute dasar dengan Dijkstra untuk studi kasus akses damkar Pasar Johar"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
run-simulation = "pathfinding.simulation:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
