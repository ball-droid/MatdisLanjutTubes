  fact_boundary:
    from_news: "kebakaran di Pasar Johar Relokasi blok F pada 2 Februari 2022; kerumunan warga membuat akses jalan menuju pasar macet dan menyulitkan damkar"
    from_map_model: "titik awal, titik tujuan, topologi jaringan, nama ruas, koordinat, bobot per ruas, dan fasilitas node (hydrant, kantor polisi, kantor damkar tambahan)"
