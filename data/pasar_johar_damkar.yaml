    arah, 19 edge berada di ruas satu arah. Penerapan aturan satu arah apa
    adanya diuji (tools/eksperimen_arah.py) dan membuat rute awal maupun
    alternatif putus, sehingga graf tetap tidak berarah sebagai penyederhanaan
    yang terdokumentasi - bukan klaim bahwa jalan tersebut dua arah. Loader
    sudah mendukung directed: true per edge bila verifikasi arah selesai.
