simulation:
  title: "Pos Damkar Madukoro ke Relokasi Pasar Johar (Semarang, 2 Februari 2022)"
  start: pos_damkar_madukoro
  goal: pasar_johar_relokasi
  blocked_edges: []
  closure_edge: e14
  closure_description: "Kerumunan warga yang menonton memadati akses utara Jl. Barito (ruas simpang Kartini menuju pasar); akses damkar lewat Jl. Barito terputus sehingga armada harus memutar ke koridor selatan."
  alternatives:
    - id: selatan_kawalan_polisi
      label: "Koridor selatan - kawalan polisi"
      purpose: >-
        Rute tercepat setelah e14 ditutup; melewati Polsek Semarang Timur
        (simpang_cipto_bugangan) sehingga menjadi perumpaan kawalan polisi
        menuju pasar.
      waypoints: []
    - id: bantuan_ambulance
      label: "Via IGD rumah sakit - bantuan ambulance"
      purpose: >-
        Mampir ke IGD RSUP Dr. Kariadi (emergency=yes,24 jam) untuk
        koordinasi ambulance sebelum lanjut ke pasar lewat koridor
        Mayjend D.I. Panjaitan - M.T. Haryono.
      waypoints:
        - rumah_sakit_kariadi
    - id: kawalan_polda_akses_tirtoyoso
      label: "Kawalan Polda + akses Tirtoyoso XI"
      purpose: >-
        Mampir ke BIDHUMAS Polda Jawa Tengah untuk kawalan, lalu masuk ke
        pasar lewat Jl. Tirtoyoso XI (e16-e15-e18) alih-alih Jl. Tirtoyoso V.
      waypoints:
        - polisi_polda_jateng
        - simpang_tirtoyoso_xi

