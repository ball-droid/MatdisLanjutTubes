  data_note: "Node dan ruas berasal dari jaringan jalan nyata di sekitar lokasi berita (OpenStreetMap, ekstraksi 2026-11-10), disederhanakan menjadi simpang-simpang utama. Bobot dihitung dari jarak peta dibagi kecepatan model (35/30/20 km/jam), sehingga angkanya menit estimasi - bukan waktu tempuh terukur atau kondisi lalu lintas pada 2 Februari 2022. Posisi persimpangan persis tetap perlu dicek ulang pada peta resmi sebelum dipakai untuk laporan final."
