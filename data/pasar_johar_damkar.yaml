  reported_fact: "Kerumunan warga yang menonton membuat jalanan macet, termasuk akses jalan menuju Pasar Johar Relokasi, sehingga kendaraan damkar sulit menembus."
  graph_source: "OpenStreetMap via Overpass API (ekstraksi 2026-11-10), disederhanakan menjadi simpang-simpang utama"
  node_count: 36
  edge_count: 38
  weight_rule: "menit = jarak_meter / (kecepatan_model km/jam) x 60; utama 35, sekunder 30, permukiman 20"
  display_weight_unit: "menit estimasi"
  weight_basis:
    formula: "menit = distance_m * 60 / (kecepatan_km_per_jam * 1000)"
    nominal_speed_kmh:
      utama: 35
      sekunder: 30
      permukiman: 20
    outliers: ["e02", "e03", "e04", "e25", "e27", "e30"]
    outlier_note: >-
      Enam ruas ini bobotnya menyimpang dari kecepatan nominal di atas
      (kecepatan tersirat 14-31 km/jam, selisih bobot maksimal 0.06 menit
      terhadap rumus). Angka tetap dipertahankan sebagai estimasi model;
      penyimpangan dicatat supaya dapat ditinjau, bukan dikoreksi diam-diam
      karena tidak ada pengukuran waktu tempuh yang menjadi rujukan.
  graph_type: "tidak berarah (dua arah) - semua edge boleh dilalui dua arah pada model ini"
  direction_note: >-
    Keputusan arah diverifikasi terhadap OpenStreetMap (tools/validasi_peta.py,
    ekstraksi 2026-11-10): 14 dari 33 edge berada di ruas yang benar-benar dua
    arah, 19 edge berada di ruas satu arah. Penerapan aturan satu arah apa
    adanya diuji (tools/eksperimen_arah.py) dan membuat rute awal maupun
    alternatif putus, sehingga graf tetap tidak berarah sebagai penyederhanaan
    yang terdokumentasi - bukan klaim bahwa jalan tersebut dua arah. Loader
    sudah mendukung directed: true per edge bila verifikasi arah selesai.
  facilities: true
  facility_note: >-
    Fasilitas node diverifikasi terhadap OpenStreetMap lewat
    tools/validasi_fasilitas.py (ekstraksi 2026-11-12): 1 node berada di
    hydrant sungguhan (Hydrant BCA, 251 m), 1 node berada di kantor polisi
    (Polsek Semarang Timur, 32 m) sehingga tidak diberi hydrant, dan 3 kantor
    pemadam tambahan (radius 5 km) dijadikan node logistik. Node lain memakai
    hydrant asumsi model dengan jejak jarak ke hydrant OSM terdekat. Jumlah
    mobil dan personel tiap kantor adalah asumsi model - tidak tersedia di
    berita maupun OSM. Ditambah satu rumah sakit (RSUP Dr. Kariadi,
    emergency=yes terverifikasi; jumlah ambulance asumsi model) dan satu
    kantor polisi (BIDHUMAS Polda Jateng) sebagai tujuan rute alternatif.
    blok `alternatives` memuat3 rute berbeda untuk3 unit damkar.

  verification:
