# Skenario berita: kebakaran Relokasi Pasar Johar di kawasan MAJT, Semarang,
# 2 Februari 2022 (Bisnis.com & ANTARA Jateng).
#
# Node dan ruas diambil dari jaringan jalan ASLI di sekitar lokasi berita
# (OpenStreetMap via Overpass API, ekstraksi 2026-11-10):
#   - titik awal : Dinas Pemadam Kebakaran Kota Semarang, Jl. Madukoro III, Krobokan
#   - titik tujuan: akses Relokasi Pasar Johar (Jl. Barito x Jl. Tirtoyoso V), Gayamsari
#   - node       : persimpangan jalan nyata (nama jalan + koordinat OSM ada di tiap node)
#   - bobot      : jarak OSM / kecepatan model (jalan utama 35 km/h, sekunder 30, permukiman 20)
#                  -> satuan MENIT ESTIMASI, bukan pengukuran lalu lintas aktual.
#
# Dua koridor utama hasil Dijkstra pada jaringan ini:
#   rute awal (tercepat): Jl. Madukoro - Cokrokembang - Sudirman - Soegiyopranoto -
#     Dokter Sutomo - Pandanaran - Kyai Saleh - Pekunden - Batan Selatan -
#     Mayjend D.I. Panjaitan - Kartini - Barito  (utara)
#   rute alternatif: Jl. Madukoro - Sudirman - Indraprasta - Kapten Piere Tendean -
#     Pemuda - Depok - KH. Wahid Hasyim - Gang Warung - Pekojan - Petudungan -
#     M.T. Haryono - Dargo - Dokter Cipto - Bugangan - Kanalsari - Tirtoyoso  (selatan)
#
# Sumber berita:
#   - https://semarang.bisnis.com/read/20220202/535/1496092/relokasi-pasar-johar-terbakar-ganjar-minta-pedagang-diprioritaskan
#   - https://jateng.antaranews.com/berita/431073/kerumunan-warga-sulitkan-pemadaman-kebakaran-pasar-johar-relokasi
# Fakta yang dipakai: kerumunan warga yang menonton membuat jalanan macet, termasuk
# akses jalan menuju pasar, sehingga kendaraan damkar sulit menembus (Ganjar Pranowo
# sempat menegur warga yang menutup jalan).
# Peta jalan: OpenStreetMap contributors (ODbL).
#
# Status akses: hanya ruas yang menjadi objek hambatan yang memakai field
# access_status; edge tanpa field tersebut diasumsikan terbuka (asumsi model).
# Verifikasi 2026-11-10 dengan tools/validasi_peta.py: 31/31 node dan 28/28 nama
# ruas cocok dengan OpenStreetMap; keputusan arah graf dijelaskan pada metadata
# (direction_note) dan docs/analisis_studi_kasus.md.

