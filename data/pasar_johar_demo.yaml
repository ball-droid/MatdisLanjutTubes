# Studi kasus berbasis berita dan gambar peta yang diberikan pengguna.
# Peristiwa nyata: kebakaran Pasar Johar Relokasi di kawasan MAJT pada 2 Feb 2022;
# berita melaporkan kerumunan warga membuat akses mobil damkar terganggu.
# Gambar peta menunjukkan Pos Pemadam Barito -> Relokasi Pasar Johar, rute mobil ~9 menit,
# serta anotasi hambatan pada akses masuk dan jalur alternatif di blok-blok sebelah barat.
#
# CATATAN METODOLOGI:
# - Topologi ini adalah penyederhanaan dari garis rute yang terlihat pada screenshot,
#   bukan hasil ekstraksi GIS/koordinat GPS.
# - Bobot dibagi menjadi estimasi per-ruas supaya rute utama berjumlah 9 unit menit
#   dan rute alternatif berjumlah 10 unit menit, sejalan dengan waktu pada screenshot.
# - Waktu per ruas, konektivitas persis, dan penyebutan Jl. Pelabuhan Ratu sebagai ruas
#   hambatan perlu diverifikasi oleh anggota B lewat peta yang lebih jelas.
# - Jangan melaporkan bobot per-edge sebagai waktu/jarak ukur aktual.

